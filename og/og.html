<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face { font-family: "Tanker"; src: url("../assets/fonts/Tanker-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Satoshi"; src: url("../assets/fonts/Satoshi-700.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Satoshi"; src: url("../assets/fonts/Satoshi-900.woff2") format("woff2"); font-weight: 900; }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(circle at 2px 2px, rgba(236, 233, 224, 0.05) 2px, transparent 0) 0 0 / 26px 26px,
      radial-gradient(700px 500px at 88% 10%, rgba(72, 167, 155, 0.22), transparent 65%),
      #010F1D;
    font-family: "Satoshi", Arial, sans-serif;
    color: #ECE9E0;
  }
  .eyebrow {
    position: absolute;
    top: 64px;
    left: 72px;
    font-weight: 900;
    font-size: 24px;
    letter-spacing: 0.16em;
    color: #48A79B;
  }
  .headline {
    position: absolute;
    top: 122px;
    left: 72px;
    font-family: "Tanker", "Arial Black", sans-serif;
    font-size: 116px;
    line-height: 0.94;
    text-transform: uppercase;
    color: #ECE9E0;
    z-index: 1;
  }
  .headline .hit { color: #FF7155; display: block; }
  .name {
    position: absolute;
    left: 72px;
    top: 388px;
    z-index: 3;
  }
  .name .who {
    font-family: "Tanker", "Arial Black", sans-serif;
    font-size: 44px;
    text-transform: uppercase;
    color: #ECE9E0;
    letter-spacing: 0.01em;
  }
  .name .what {
    margin-top: 10px;
    font-weight: 700;
    font-size: 24px;
    color: #9BA6AE;
    max-width: 660px;
    line-height: 1.4;
  }
  .name .what strong { color: #ECE9E0; }
  .band {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 78px;
    background: #FF7155;
    display: flex;
    align-items: center;
    padding-left: 72px;
    font-weight: 900;
    font-size: 25px;
    letter-spacing: 0.14em;
    color: #010F1D;
    z-index: 2;
  }
  .billy {
    position: absolute;
    right: -24px;
    bottom: 0;
    height: 606px;
    z-index: 2;
    filter: drop-shadow(-18px 0 44px rgba(1, 15, 29, 0.65));
  }
</style>
</head>
<body>
  <div class="og">
    <p class="eyebrow">GLOBAL KEYNOTE SPEAKER</p>
    <h1 class="headline">Winning isn't luck.<span class="hit">It's a system.</span></h1>
    <div class="name">
      <p class="who">Billy Ray Taylor</p>
      <p class="what">Author of <strong>The Winning Link</strong>. Helped swing Goodyear's earnings from <strong>-$38M to $1B+</strong>.</p>
    </div>
    <p class="band">TRUSTED BY NIKE · GE · SHINGO · U.S. ARMY</p>
    <img class="billy" src="../assets/Billy-Taylor-066-copy-min.png" alt="">
  </div>
</body>
</html>
