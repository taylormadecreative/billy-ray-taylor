<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face { font-family: "Big Shoulders Display"; src: url("../assets/fonts/BigShouldersDisplay-var.woff2") format("woff2-variations"); font-weight: 100 900; }
@font-face { font-family: "Archivo"; src: url("../assets/fonts/Archivo-var.woff2") format("woff2-variations"); font-weight: 100 900; }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    font-family: "Archivo", Arial, sans-serif;
    color: #ECE9E0;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-image: url("../assets/billy-hero-wall.png");
    background-size: cover;
    background-position: 72% center;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(96deg,
      rgba(1,15,29,0.94) 0%,
      rgba(1,15,29,0.82) 26%,
      rgba(1,15,29,0.44) 46%,
      rgba(1,15,29,0.05) 62%,
      transparent 76%);
  }
  .content {
    position: absolute;
    left: 68px;
    top: 92px;
    width: 720px;
    z-index: 2;
  }
  .eyebrow {
    font-weight: 900;
    font-size: 21px;
    letter-spacing: 0.15em;
    color: #B56CD2;
    margin-bottom: 26px;
  }
  h1 {
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
    font-weight: 800;
    font-size: 92px;
    line-height: 0.84;
    text-transform: uppercase;
  }
  h1 .l1 {
    display: block;
    color: transparent;
    -webkit-text-stroke: 2px #ECE9E0;
  }
  h1 .l2 { display: block; color: #B56CD2; }
  .name {
    margin-top: 42px;
    font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
    font-weight: 800;
    font-size: 46px;
    text-transform: uppercase;
    color: #ECE9E0;
  }
  .what {
    margin-top: 10px;
    font-weight: 700;
    font-size: 21px;
    color: rgba(236,233,224,0.8);
    line-height: 1.45;
  }
  .what strong { color: #FFFFFF; }
  .band {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 66px;
    background: #B56CD2;
    display: flex;
    align-items: center;
    padding-left: 68px;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.13em;
    color: #010F1D;
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="og">
    <div class="bg"></div>
    <div class="scrim"></div>
    <div class="content">
      <p class="eyebrow">GLOBAL KEYNOTE SPEAKER</p>
      <h1><span class="l1">Winning isn't luck.</span><span class="l2">It's a system.</span></h1>
      <p class="name">Billy Ray Taylor</p>
      <p class="what">Author of <strong>The Winning Link</strong>. Helped swing Goodyear's earnings from <strong>-$38M to $1B+</strong>.</p>
    </div>
    <p class="band">TRUSTED BY NIKE · GE · SHINGO · U.S. ARMY</p>
  </div>
</body>
</html>
